<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manheim Auction Dashboard - Real Data</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .badge-live {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-left: 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filters {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .filter-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 600;
            font-size: 0.9em;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .vehicles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .vehicle-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .vehicle-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .vehicle-image-container {
            position: relative;
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        .vehicle-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 4em;
        }

        .image-count {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        .vehicle-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }

        .vehicle-title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .vehicle-subtitle {
            opacity: 0.95;
            font-size: 1em;
        }

        .vehicle-body {
            padding: 20px;
        }

        .vehicle-detail {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .vehicle-detail:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-weight: 500;
            font-size: 0.95em;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
            text-align: right;
        }

        .price-large {
            color: #667eea;
            font-size: 1.8em;
            font-weight: bold;
        }

        .vin-code {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin: 5px 5px 0 0;
        }

        .badge-honda {
            background: #e3f2fd;
            color: #1976d2;
        }

        .badge-toyota {
            background: #ffebee;
            color: #c62828;
        }

        .badge-excellent {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .badge-good {
            background: #fff3e0;
            color: #f57c00;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            color: white;
            font-size: 1.5em;
        }

        .loading-spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            color: white;
            padding: 30px;
            margin-top: 30px;
        }

        .footer-info {
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .view-toggle {
            margin-bottom: 20px;
        }

        .view-toggle button {
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .vehicles-grid {
                grid-template-columns: 1fr;
            }

            .filter-row {
                flex-direction: column;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 Manheim Auction Dashboard <span class="badge-live" id="liveIndicator">● SAMPLE DATA</span></h1>
            <p class="subtitle">Honda & Toyota Vehicle Listings - Complete Information & Images</p>
        </header>

        <div id="stats" class="stats-grid"></div>

        <div class="filters">
            <h3 style="margin-bottom: 20px; color: #333;">🔍 Filter & Search</h3>
            <div class="filter-row">
                <div class="filter-group">
                    <label>Make</label>
                    <select id="filterMake">
                        <option value="">All Makes</option>
                        <option value="Honda">Honda</option>
                        <option value="Toyota">Toyota</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Model</label>
                    <select id="filterModel">
                        <option value="">All Models</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Year</label>
                    <select id="filterYear">
                        <option value="">All Years</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Max Price</label>
                    <input type="number" id="filterPrice" placeholder="e.g., 30000">
                </div>
            </div>
            <div class="filter-row">
                <div class="filter-group">
                    <label>Max Mileage</label>
                    <input type="number" id="filterMileage" placeholder="e.g., 50000">
                </div>
                <div class="filter-group">
                    <label>Condition</label>
                    <select id="filterCondition">
                        <option value="">All Conditions</option>
                        <option value="Like New">Like New</option>
                        <option value="Excellent">Excellent</option>
                        <option value="Very Good">Very Good</option>
                        <option value="Good">Good</option>
                    </select>
                </div>
                <div class="filter-group" style="flex: 2;">
                    <label>Search (Model, VIN, Location, Color)</label>
                    <input type="text" id="searchBox" placeholder="Search anything...">
                </div>
                <div class="filter-actions">
                    <button class="btn btn-secondary" onclick="resetFilters()">Clear</button>
                </div>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <div>Loading vehicle data...</div>
        </div>

        <div id="vehicleCount" style="color: white; text-align: center; font-size: 1.2em; margin-bottom: 20px; display: none;"></div>

        <div id="vehicles" class="vehicles-grid" style="display: none;"></div>

        <footer>
            <div class="footer-info">
                <strong>Data scraped:</strong> <span id="scrapedTime"></span>
            </div>
            <p>Manheim Auction Scraper • Built with ❤️ • Run locally to get real live data</p>
        </footer>
    </div>

    <script>
        let allVehicles = [];
        let filteredVehicles = [];
        let allModels = new Set();
        let allYears = new Set();

        // Load data
        fetch('vehicles.json')
            .then(response => response.json())
            .then(data => {
                allVehicles = data.vehiclesFromDOM || [];
                filteredVehicles = allVehicles;

                // Extract unique models and years
                allVehicles.forEach(v => {
                    if (v.model) allModels.add(v.model);
                    if (v.year) allYears.add(v.year);
                });

                // Populate filter dropdowns
                populateFilterDropdowns();

                displayStats(data.summary);
                displayVehicles(filteredVehicles);

                const scrapedDate = new Date(data.scrapedAt);
                document.getElementById('scrapedTime').textContent = scrapedDate.toLocaleString();

                // Update live indicator
                const now = new Date();
                const hoursSinceUpdate = (now - scrapedDate) / (1000 * 60 * 60);
                const liveIndicator = document.getElementById('liveIndicator');
                if (hoursSinceUpdate < 1) {
                    liveIndicator.textContent = '● LIVE DATA';
                    liveIndicator.style.background = '#4caf50';
                } else {
                    liveIndicator.textContent = `● Updated ${Math.round(hoursSinceUpdate)}h ago`;
                    liveIndicator.style.background = '#ff9800';
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('vehicles').style.display = 'grid';
                document.getElementById('vehicleCount').style.display = 'block';

                setupFilters();
            })
            .catch(error => {
                document.getElementById('loading').innerHTML =
                    '<div style="color: #ff5252; font-size: 1.3em;">⚠️ Error loading data</div>' +
                    '<div style="margin-top: 15px;">Make sure vehicles.json exists and run the scraper locally to get real data.</div>';
                console.error('Error:', error);
            });

        function populateFilterDropdowns() {
            const modelSelect = document.getElementById('filterModel');
            const yearSelect = document.getElementById('filterYear');

            Array.from(allModels).sort().forEach(model => {
                const option = document.createElement('option');
                option.value = model;
                option.textContent = model;
                modelSelect.appendChild(option);
            });

            Array.from(allYears).sort().reverse().forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            });
        }

        function displayStats(summary) {
            if (!summary) {
                summary = generateClientSummary(allVehicles);
            }

            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-value">${summary.totalVehicles || 0}</div>
                    <div class="stat-label">Total Vehicles</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${summary.byMake?.Honda || 0}</div>
                    <div class="stat-label">Honda</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${summary.byMake?.Toyota || 0}</div>
                    <div class="stat-label">Toyota</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${summary.priceRange?.averageFormatted || 'N/A'}</div>
                    <div class="stat-label">Avg Price</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${summary.mileageRange?.averageFormatted || 'N/A'}</div>
                    <div class="stat-label">Avg Miles</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${summary.withImages || 0}</div>
                    <div class="stat-label">With Images</div>
                </div>
            `;
            document.getElementById('stats').innerHTML = statsHtml;
        }

        function generateClientSummary(vehicles) {
            // Generate summary on client side if not provided
            const summary = {
                totalVehicles: vehicles.length,
                byMake: {},
                withImages: 0
            };

            vehicles.forEach(v => {
                if (v.make) summary.byMake[v.make] = (summary.byMake[v.make] || 0) + 1;
                if (v.images && v.images.length > 0) summary.withImages++;
            });

            return summary;
        }

        function displayVehicles(vehicles) {
            document.getElementById('vehicleCount').innerHTML =
                `<strong>${vehicles.length}</strong> vehicle${vehicles.length !== 1 ? 's' : ''} found`;

            const vehiclesHtml = vehicles.map((vehicle, idx) => {
                const imageHtml = getImageHtml(vehicle);
                const hasImages = vehicle.images && vehicle.images.length > 0;

                return `
                    <div class="vehicle-card">
                        <div class="vehicle-image-container">
                            ${imageHtml}
                            ${hasImages ? `<div class="image-count">📸 ${vehicle.images.length}</div>` : ''}
                        </div>
                        <div class="vehicle-header">
                            <div class="vehicle-title">${vehicle.year || ''} ${vehicle.make || ''} ${vehicle.model || ''}</div>
                            <div class="vehicle-subtitle">${vehicle.trim || 'Base Trim'} ${vehicle.transmission ? '• ' + vehicle.transmission : ''}</div>
                        </div>
                        <div class="vehicle-body">
                            <div class="vehicle-detail">
                                <span class="detail-label">Price</span>
                                <span class="detail-value price-large">${vehicle.price || 'Contact'}</span>
                            </div>
                            <div class="vehicle-detail">
                                <span class="detail-label">VIN</span>
                                <span class="detail-value vin-code">${vehicle.vin || 'N/A'}</span>
                            </div>
                            <div class="vehicle-detail">
                                <span class="detail-label">Mileage</span>
                                <span class="detail-value">${vehicle.mileage ? vehicle.mileage + ' mi' : 'N/A'}</span>
                            </div>
                            ${vehicle.color ? `
                            <div class="vehicle-detail">
                                <span class="detail-label">Color</span>
                                <span class="detail-value">${vehicle.color}</span>
                            </div>` : ''}
                            ${vehicle.engine ? `
                            <div class="vehicle-detail">
                                <span class="detail-label">Engine</span>
                                <span class="detail-value">${vehicle.engine}</span>
                            </div>` : ''}
                            ${vehicle.drivetrain ? `
                            <div class="vehicle-detail">
                                <span class="detail-label">Drivetrain</span>
                                <span class="detail-value">${vehicle.drivetrain}</span>
                            </div>` : ''}
                            ${vehicle.condition ? `
                            <div class="vehicle-detail">
                                <span class="detail-label">Condition</span>
                                <span class="detail-value badge badge-${vehicle.condition.toLowerCase().replace(' ', '-')}">${vehicle.condition}</span>
                            </div>` : ''}
                            ${vehicle.location ? `
                            <div class="vehicle-detail">
                                <span class="detail-label">Location</span>
                                <span class="detail-value">📍 ${vehicle.location}</span>
                            </div>` : ''}
                            <div style="margin-top: 15px;">
                                <span class="badge badge-${vehicle.make?.toLowerCase()}">${vehicle.make}</span>
                                ${vehicle.bodyStyle ? `<span class="badge" style="background: #f5f5f5; color: #666;">${vehicle.bodyStyle}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('vehicles').innerHTML = vehiclesHtml ||
                '<div class="loading">No vehicles match your filters. Try adjusting your search criteria.</div>';
        }

        function getImageHtml(vehicle) {
            if (vehicle.localImages && vehicle.localImages.length > 0) {
                return `<img src="${vehicle.localImages[0]}" alt="${vehicle.year} ${vehicle.make} ${vehicle.model}" class="vehicle-image" onerror="this.parentElement.innerHTML='<div class=\\'image-placeholder\\'>🚗</div>'">`;
            } else if (vehicle.images && vehicle.images.length > 0) {
                return `<img src="${vehicle.images[0]}" alt="${vehicle.year} ${vehicle.make} ${vehicle.model}" class="vehicle-image" onerror="this.parentElement.innerHTML='<div class=\\'image-placeholder\\'>🚗</div>'">`;
            } else {
                return '<div class="image-placeholder">🚗</div>';
            }
        }

        function setupFilters() {
            const filters = ['filterMake', 'filterModel', 'filterYear', 'filterPrice', 'filterMileage', 'filterCondition', 'searchBox'];

            filters.forEach(filterId => {
                const element = document.getElementById(filterId);
                element.addEventListener('change', applyFilters);
                element.addEventListener('input', applyFilters);
            });
        }

        function applyFilters() {
            const make = document.getElementById('filterMake').value;
            const model = document.getElementById('filterModel').value;
            const year = document.getElementById('filterYear').value;
            const maxPrice = document.getElementById('filterPrice').value;
            const maxMileage = document.getElementById('filterMileage').value;
            const condition = document.getElementById('filterCondition').value;
            const search = document.getElementById('searchBox').value.toLowerCase();

            filteredVehicles = allVehicles.filter(vehicle => {
                if (make && vehicle.make !== make) return false;
                if (model && vehicle.model !== model) return false;
                if (year && vehicle.year !== year) return false;

                if (maxPrice) {
                    const price = vehicle.priceNumeric || parseInt((vehicle.price || '').replace(/[$,]/g, ''));
                    if (price > parseInt(maxPrice)) return false;
                }

                if (maxMileage) {
                    const mileage = vehicle.mileageNumeric || parseInt((vehicle.mileage || '').replace(/,/g, ''));
                    if (mileage > parseInt(maxMileage)) return false;
                }

                if (condition && vehicle.condition !== condition) return false;

                if (search) {
                    const searchText = `${vehicle.model} ${vehicle.vin} ${vehicle.location} ${vehicle.color} ${vehicle.trim} ${vehicle.engine}`.toLowerCase();
                    if (!searchText.includes(search)) return false;
                }

                return true;
            });

            displayVehicles(filteredVehicles);
        }

        function resetFilters() {
            document.getElementById('filterMake').value = '';
            document.getElementById('filterModel').value = '';
            document.getElementById('filterYear').value = '';
            document.getElementById('filterPrice').value = '';
            document.getElementById('filterMileage').value = '';
            document.getElementById('filterCondition').value = '';
            document.getElementById('searchBox').value = '';
            filteredVehicles = allVehicles;
            displayVehicles(filteredVehicles);
        }
    </script>
</body>
</html>
